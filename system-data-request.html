<style>
:root{

  --old:#e8f1ea; --old-ink:#1f5a35;
  --crit:#fde8e4; --crit-ink:#8a2a16;
  --sec:#f1ede4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171b; --card:#1d2026; --ink:#e8e6e1; --muted:#a2a8b3; --line:#30343c;
    --head:#262a32; --accent:#e0714f; --accent-ink:#15171b;
    --new:#3a3012; --new-ink:#f2d58a; --new-line:#7a5f1e;
    --old:#17301f; --old-ink:#9fd7b2;
    --crit:#3d1b14; --crit-ink:#f5a58f;
    --sec:#22262d;
  }
}
:root[data-theme="dark"]{
  --bg:#15171b; --card:#1d2026; --ink:#e8e6e1; --muted:#a2a8b3; --line:#30343c;
  --head:#262a32; --accent:#e0714f; --accent-ink:#15171b;
  --new:#3a3012; --new-ink:#f2d58a; --new-line:#7a5f1e;
  --old:#17301f; --old-ink:#9fd7b2;
  --crit:#3d1b14; --crit-ink:#f5a58f;
  --sec:#22262d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55}
html[lang="ko"] body{font-family:"Noto Sans KR","Sarabun",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:26px;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);margin:0;font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:active{transform:translateY(1px)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;border-radius:0;padding:8px 12px;background:var(--card)}
.lang button+button{border-left:1px solid var(--line)}
.lang button.on{background:var(--ink);color:var(--bg)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px;font-size:13px;color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.old{background:var(--old);color:var(--old-ink)}
.tag.new{background:var(--new);color:var(--new-ink);border:1px solid var(--new-line)}
.tag.crit{background:var(--crit);color:var(--crit-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
thead th{background:var(--head);border-top:0;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
td.n{width:40px;color:var(--muted);font-variant-numeric:tabular-nums}
td.k{width:30%;font-weight:600}
td.s{width:104px;white-space:nowrap}
code{font-size:13px;background:var(--sec);padding:1px 5px;border-radius:4px}
tr.sec td{background:var(--sec);font-weight:700;font-size:14px;padding:8px 12px;color:var(--muted)}
tr.crit td.k::before{content:"★ ";color:var(--accent)}
.note{margin:18px 0 0;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px}
.note h2{font-size:16px;margin:0 0 6px}
.note ol{margin:0;padding-left:22px}
.note li{margin:4px 0}
footer{margin-top:18px;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){
  td.k{width:auto} td.s{width:auto}
  thead{display:none}
  tr{display:block;border-top:1px solid var(--line)}
  tr.sec{border-top:0}
  td{display:block;border-top:0;padding:4px 12px}
  td.n{display:none}
  td.k{padding-top:10px}
  td.s{padding-bottom:10px}
}
@media print{
  body{background:#fff;color:#000}
  .tools,.toast{display:none}
  .card,.note{border-color:#999}
}
</style>
</head>

</div>

</div>

/* row → section index, status */
var ROWMETA = [
  [0,"old"],[0,"new"],[0,"old"],
  [1,"old"],[1,"new"],[1,"old"],[1,"old"],[1,"old"],[1,"new"],[1,"new"],
  [2,"old"],[2,"new"],[2,"new"],[2,"crit"],[2,"new"],
  [3,"new"],[3,"crit"],
  [4,"crit"],
  [5,"new"],[5,"new"],
  [6,"new"],[6,"new"]
];
var LANG = "th";
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function render(){
  var T = I18N[LANG];
  document.documentElement.setAttribute("lang", LANG);
  document.title = T.title.split(" · ")[0];
  document.getElementById("t-title").textContent = T.title;
  document.getElementById("t-sub").textContent = T.sub;
  document.getElementById("copyBtn").textContent = T.copy;
  document.getElementById("themeBtn").textContent = T.theme;
  document.getElementById("printBtn").textContent = T.print;
  document.getElementById("h-k").textContent = T.head.k;
  document.getElementById("h-w").textContent = T.head.w;
  document.getElementById("h-s").textContent = T.head.s;
  document.getElementById("legend").innerHTML =
    "<span><span class=\"tag old\">"+esc(T.tag.old)+"</span> "+esc(T.legend.old)+"</span>"+
    "<span><span class=\"tag new\">"+esc(T.tag["new"])+"</span> "+esc(T.legend["new"])+"</span>"+
    "<span><span class=\"tag crit\">"+esc(T.tag.crit)+"</span> "+esc(T.legend.crit)+"</span>";
  var h = [], lastSec = -1;
  T.rows.forEach(function(r, i){
    var sec = ROWMETA[i][0], st = ROWMETA[i][1];
    if (sec !== lastSec){ h.push("<tr class=\"sec\"><td colspan=\"4\">"+esc(T.sections[sec])+"</td></tr>"); lastSec = sec; }
    h.push("<tr class=\""+st+"\"><td class=\"n\">"+(i+1)+"</td><td class=\"k\">"+r[0]+"</td><td class=\"w\">"+r[1]+"</td><td class=\"s\"><span class=\"tag "+st+"\">"+esc(T.tag[st])+"</span></td></tr>");
  });
  document.getElementById("tbody").innerHTML = h.join("");
  document.getElementById("t-note").textContent = T.note;
  document.getElementById("noteList").innerHTML = T.notes.map(function(n){return "<li>"+n+"</li>";}).join("");
  document.getElementById("t-foot").textContent = T.foot;
  document.querySelectorAll("#langBox button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-lang")===LANG); });
}
function toText(){
  var T = I18N[LANG], L = [T.title, T.sub, ""], lastSec = -1;
  var strip = function(s){ var d=document.createElement("div"); d.innerHTML=s; return d.textContent; };
  T.rows.forEach(function(r, i){
    var sec = ROWMETA[i][0], st = ROWMETA[i][1];
    if (sec !== lastSec){ L.push(""); L.push("== "+T.sections[sec]+" =="); lastSec = sec; }
    L.push((i+1)+". "+strip(r[0])+" ["+T.tag[st]+"]\t"+strip(r[1]));
  });
  L.push(""); L.push(T.note);
  T.notes.forEach(function(n, i){ L.push((i+1)+") "+strip(n)); });
  return L.join("\n");
}
(function(){
  var root = document.documentElement;
  try{ var t = localStorage.getItem("ropz-theme"); if (t) root.setAttribute("data-theme", t); }catch(e){}
  try{
    var q = (location.search.match(/[?&]lang=(th|en|ko)/)||[])[1];
    var saved = localStorage.getItem("ropz-sysreq-lang");
    LANG = q || saved || "th";
  }catch(e){}
  render();
  document.getElementById("langBox").addEventListener("click", function(ev){
    var b = ev.target.closest("button"); if (!b) return;
    LANG = b.getAttribute("data-lang");
    try{ localStorage.setItem("ropz-sysreq-lang", LANG); }catch(e){}
    render();
  });
  document.getElementById("themeBtn").addEventListener("click", function(){
    var cur = root.getAttribute("data-theme");
    var dark = cur ? cur==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try{ localStorage.setItem("ropz-theme", next); }catch(e){}
  });
  document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
  function toast(msg){ var el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); setTimeout(function(){ el.classList.remove("show"); },1400); }
  function fallback(txt){ var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast(I18N[LANG].copied); }catch(e){ toast(I18N[LANG].copyfail); } document.body.removeChild(ta); }
  document.getElementById("copyBtn").addEventListener("click", function(){
    var txt = toText();
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ toast(I18N[LANG].copied); }, function(){ fallback(txt); }); }
    else fallback(txt);
  });
})();
</script>
