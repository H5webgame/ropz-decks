<style>
:root{
  --bg:#0E1116; --card:#161A22; --line:#262C38; --ink:#E6E9EF; --muted:#8B93A3;
  --accent:#22B8CF; --bad:#F87171;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#F6F7F9; --card:#FFFFFF; --line:#E2E5EA; --ink:#1A1D23;
         --muted:#5A6270; --accent:#0E7490; --bad:#B91C1C; }
}
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); display:grid; place-items:center;
  padding:1.5rem; font:16px/1.6 "Segoe UI",system-ui,-apple-system,"Noto Sans Thai",
  "Malgun Gothic","Microsoft YaHei",sans-serif; }
.gate{ width:min(30rem,100%); background:var(--card); border:1px solid var(--line);
  border-radius:14px; padding:2rem 1.9rem 1.6rem; }
.brand{ font-size:.68rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--accent); font-weight:700; margin:0 0 .9rem; }
h1{ font-size:1.16rem; line-height:1.4; margin:0 0 .55rem; font-weight:650; }
.sub{ margin:0 0 1.4rem; color:var(--muted); font-size:.88rem; }
.sub span{ display:block; margin-top:.15rem; }
form{ display:flex; gap:.5rem; }
input{ flex:1 1 auto; min-width:0; font:inherit; font-size:.92rem; padding:.6rem .75rem;
  background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:8px; }
input:focus{ outline:none; border-color:var(--accent); }
button{ flex:none; font:inherit; font-size:.88rem; font-weight:650; padding:.6rem 1.1rem;
  background:var(--accent); color:var(--card); border:none; border-radius:8px; cursor:pointer; }
button:disabled{ opacity:.55; cursor:progress; }
.msg{ min-height:1.4em; margin:.8rem 0 0; font-size:.84rem; color:var(--bad); }
.msg.work{ color:var(--muted); }
.fine{ margin:1.5rem 0 0; padding-top:1rem; border-top:1px solid var(--line);
  color:var(--muted); font-size:.72rem; line-height:1.65; }
.fine code{ font-family:Consolas,ui-monospace,monospace; font-size:.95em; color:var(--ink); }
</style>

function b64(s){
  var bin = atob(s), u = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function say(t, working){
  var m = document.getElementById("msg");
  m.textContent = t; m.className = "msg" + (working ? " work" : "");
}
async function ungzip(buf){
  if (typeof DecompressionStream !== "function")
    throw new Error("browser too old for DecompressionStream");
  var ds = new DecompressionStream("gzip");
  var stream = new Blob([buf]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unlock(pass){
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  var packed = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(IV) }, key, b64(CT));
  var html = new TextDecoder().decode(await ungzip(packed));
  swap(html);
}
/* สลับเนื้อในของ head/body แทน document.write (ซึ่งค้างกับไฟล์ขนาดหลายแสนไบต์)
   และแทน replaceChild ทั้ง documentElement (ซึ่งทำให้ renderer ค้างเช่นกัน)
   วิธีนี้คง URL เดิมไว้ ?lang= จึงยังทำงาน แต่ script ที่ parse มาจะไม่รันเอง
   ต้องสร้าง <script> ใหม่ทับทีละตัว */
function swap(html){
  var doc = new DOMParser().parseFromString(html, "text/html");
  document.head.innerHTML = doc.head.innerHTML;
  document.body.innerHTML = doc.body.innerHTML;
  document.body.className = doc.body.className;
  var root = doc.documentElement;
  for (var a = 0; a < root.attributes.length; a++)
    document.documentElement.setAttribute(root.attributes[a].name, root.attributes[a].value);
  var olds = [].slice.call(document.querySelectorAll("script"));
  for (var i = 0; i < olds.length; i++){
    var s = document.createElement("script");
    for (var j = 0; j < olds[i].attributes.length; j++)
      s.setAttribute(olds[i].attributes[j].name, olds[i].attributes[j].value);
    s.textContent = olds[i].textContent;
    olds[i].parentNode.replaceChild(s, olds[i]);
  }
}
document.getElementById("f").addEventListener("submit", function(e){
  e.preventDefault();
  var pw = document.getElementById("pw").value;
  if (!pw) return;
  var btn = document.getElementById("go");
  btn.disabled = true;
  say("Decrypting… / กำลังถอดรหัส…", true);
  /* หน่วงให้ข้อความขึ้นก่อน PBKDF2 กินเธรดหลัก — ห้ามใช้ requestAnimationFrame
     เพราะมันไม่ยิงเมื่อหน้าอยู่ในแท็บหลัง จะทำให้ค้างที่ "กำลังถอดรหัส" ตลอดไป */
  setTimeout(async function(){
    try { await unlock(pw); }
    catch (err){
      btn.disabled = false;
      say(String(err).indexOf("DecompressionStream") >= 0
        ? "This browser is too old to open the document."
        : "Wrong passphrase. / รหัสผ่านไม่ถูกต้อง");
      document.getElementById("pw").select();
    }
  }, 30);
});
if (!window.crypto || !crypto.subtle)
  say("Needs a secure context (https). / ต้องเปิดผ่าน https");
</script>
