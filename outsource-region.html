  .lbl{margin-right:auto;align-self:center;color:var(--muted);font-size:12.5px;letter-spacing:.5px}
  .langbtn{background:var(--chip);border:1px solid var(--line);color:var(--soft);cursor:pointer;
    padding:6px 14px;border-radius:999px;font-size:13px;font-family:inherit;transition:.15s}
  .langbtn:hover{border-color:var(--accent)}
  .langbtn.on{background:linear-gradient(135deg,#6c8cff,#8a6cff);color:#fff;border-color:transparent;font-weight:700}
  header.head{background:linear-gradient(135deg,#1a2140,#241b46);border:1px solid var(--line);border-radius:16px;padding:20px 24px;position:relative;overflow:hidden}
  header.head::after{content:"🌏";position:absolute;right:18px;top:4px;font-size:78px;opacity:.10}
  header.head h1{margin:0 0 4px;font-size:22px}
  header.head .sub{color:var(--soft);font-size:13px}
  .controls{margin:14px 0;padding:13px 16px;border-radius:13px;background:var(--card2);border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center}

  .controls .hint{color:var(--amber);font-size:12px;width:100%}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
  @media(max-width:640px){.cards{grid-template-columns:1fr}}

  .ccard.th{border-top:3px solid var(--green)} .ccard.cn{border-top:3px solid var(--amber)} .ccard.we{border-top:3px solid #ff6b6b}

  .ccard .baht{font-size:24px;font-weight:800}

  .ccard .x{color:var(--muted);font-size:12px;margin-top:6px}
  h2.sec{font-size:13px;letter-spacing:1px;color:var(--muted);margin:26px 0 10px;font-weight:700}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th{background:var(--card2);color:var(--muted);text-align:right;padding:10px 11px;font-size:11.5px;border-bottom:1px solid var(--line)}
  th:first-child{text-align:left}
  td{padding:8px 11px;border-bottom:1px solid var(--line);text-align:right}
  td:first-child{text-align:left}
  tr:last-child td{border-bottom:none}
  .grouprow td{background:rgba(108,140,255,.13);font-weight:700;color:#cdd9ff}
  .subrow td{background:rgba(255,255,255,.03);font-weight:700}
  .totrow td{background:rgba(244,183,64,.13);font-weight:800;font-size:14px}
  .th{color:#7fe3b6} .cn{color:#f6c662} .we{color:#ff9b9b}
  .base{color:#fff}
  .note{margin-top:14px;padding:13px 16px;border-radius:12px;background:rgba(108,140,255,.08);border:1px solid rgba(108,140,255,.25);color:var(--soft);font-size:13px}
  .note b{color:#fff}
  .ccard.rd{border-top:3px solid var(--accent)}
  .ccard .dt{color:var(--blue);font-weight:700;font-size:12.5px;margin-top:2px}
  /* horizontal timeline */
  .htl{margin:18px 0 12px;padding:6px 4px}
  .htl .lab{display:flex}
  .htl .lab>div{flex:1;text-align:center;padding:0 8px}
  .htl .line{position:relative;height:28px;margin:5px 0}
  .htl .track{position:absolute;top:12px;left:16.66%;right:16.66%;height:4px;border-radius:3px;
    background:linear-gradient(90deg,#2ecc8f,#6c8cff,#f4b740)}
  .htl .dots{display:flex;height:100%}
  .htl .dots>div{flex:1;display:flex;justify-content:center;align-items:center}
  .htl .dot{width:20px;height:20px;border-radius:50%;background:var(--bg);border:4px solid var(--accent);
    box-shadow:0 0 0 4px rgba(108,140,255,.18)}
  .htl .dot.g{border-color:var(--green);box-shadow:0 0 0 4px rgba(46,204,143,.18)}
  .htl .dot.a{border-color:var(--amber);box-shadow:0 0 0 4px rgba(244,183,64,.2)}
  .htl .rn{font-weight:800;color:#cdd9ff;font-size:13px}
  .htl .dd{color:var(--blue);font-weight:700;font-size:13px}
  .htl .ph{color:var(--muted);font-size:11px;margin-top:1px}
  .htl .gm{color:var(--soft);font-size:11.5px;margin-top:5px}
  .htl .amt{font-weight:800;font-size:15px;margin-top:3px;color:#7fe3b6}
  .htl .amt.a{color:#f6c662}
  @media(max-width:640px){.htl .gm{display:none}.htl .amt{font-size:12.5px}}
  footer{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}

/* ================= helper ================= */
function el(id){return document.getElementById(id);}
function baht(n){return "฿"+Math.round(n).toLocaleString("en-US");}
function usd(n){return "$"+Math.round(n).toLocaleString("en-US");}
function mid(it){return (it.q*it.lo + it.q*it.hi)/2;}
function roundLabel(d,i){ return d.round+(i+1)+(d.roundSuffix||""); }

var cur="th";

/* ================= render ================= */
function render(){
  var d=T[cur];
  var fx=parseFloat(el("fx").value)||36;
  var mTH=parseFloat(el("mTH").value)||1, mCN=parseFloat(el("mCN").value)||1, mWE=parseFloat(el("mWE").value)||1;

  /* --- static labels --- */
  document.documentElement.lang=d.htmlLang;
  document.title=d.title;
  el("h-title").textContent=d.h1;
  el("h-sub").textContent=d.sub;
  el("l-fx").textContent=d.fx;
  el("l-mth").textContent=d.mTH;
  el("l-mcn").textContent=d.mCN;
  el("l-mwe").textContent=d.mWE;
  el("l-hint").textContent=d.hint;
  el("sec-tbl").textContent=d.secTbl;
  el("sec-tl").textContent=d.secTL;
  el("foot").textContent=d.foot;
  Array.prototype.forEach.call(document.querySelectorAll(".langbtn"),function(b){
    b.className="langbtn"+(b.getAttribute("data-l")===cur?" on":"");
  });

  /* --- main table --- */
  var grand={th:0,cn:0,we:0,base:0};
  var html="<thead><tr>";
  d.cols.forEach(function(c){ html+="<th>"+c+"</th>"; });
  html+="</tr></thead><tbody>";
  GROUPS.forEach(function(g){
    html+='<tr class="grouprow"><td colspan="5">'+d.groups[g.key]+'</td></tr>';
    var sub={th:0,cn:0,we:0,base:0};
    g.items.forEach(function(it){
      var m=mid(it);
      sub.base+=m; sub.th+=m*mTH; sub.cn+=m*mCN; sub.we+=m*mWE;
      html+="<tr><td>"+d.items[it.id]+(it.glob?' <span style="color:#f4b740">'+d.globTag+'</span>':"")+"</td>"+
        "<td class='base'>"+usd(m)+"</td>"+
        "<td class='th'>"+baht(m*mTH*fx)+"</td>"+
        "<td class='cn'>"+baht(m*mCN*fx)+"</td>"+
        "<td class='we'>"+baht(m*mWE*fx)+"</td></tr>";
    });
    html+='<tr class="subrow"><td>'+d.subtotal+g.key+'</td><td class="base">'+usd(sub.base)+'</td>'+
      '<td class="th">'+baht(sub.th*fx)+'</td><td class="cn">'+baht(sub.cn*fx)+'</td><td class="we">'+baht(sub.we*fx)+'</td></tr>';
    grand.base+=sub.base; grand.th+=sub.th; grand.cn+=sub.cn; grand.we+=sub.we;
  });
  html+='<tr class="totrow"><td>'+d.grand+'</td><td class="base">'+usd(grand.base)+'</td>'+
    '<td class="th">'+baht(grand.th*fx)+'</td><td class="cn">'+baht(grand.cn*fx)+'</td><td class="we">'+baht(grand.we*fx)+'</td></tr>';
  html+="</tbody>";
  el("tbl").innerHTML=html;

  /* --- region cards --- */
  el("cards").innerHTML=
    card("th",d.regions[0],grand.th,fx,mTH,d)+
    card("cn",d.regions[1],grand.cn,fx,mCN,d)+
    card("we",d.regions[2],grand.we,fx,mWE,d);

  /* --- insight --- */
  var diffCN=grand.cn-grand.th, pctCN=Math.round((grand.cn/grand.th-1)*100);
  el("insight").innerHTML=d.insight
    .replace("{diff}",baht(diffCN*fx)).replace("{pct}",pctCN).replace("{adj}",baht(25000*fx));

  /* ===== Outsource delivery timeline (per-round asset allocation) ===== */
  var GPR=20, NR=3;
  function byId(id){
    for(var i=0;i<GROUPS.length;i++){
      for(var j=0;j<GROUPS[i].items.length;j++){ if(GROUPS[i].items[j].id===id) return GROUPS[i].items[j]; }
    }
    return null;
  }
  var miniIt=byId("mini");
  var miniPer=(miniIt.lo+miniIt.hi)/2;
  /* game-making assets → spread across all 3 rounds (÷3) */
  var gameAssets=["ui","qa","sfx","chibi"];
  /* decoration / seasonal → round 3 only (full) */
  var r3Assets=["prop","costume","reskin","evext"];

  var matrix=[{label:d.mxMini, cells:[GPR*miniPer,GPR*miniPer,GPR*miniPer]}];
  gameAssets.forEach(function(id){ var v=mid(byId(id))/NR; matrix.push({label:d.mx[id], cells:[v,v,v]}); });
  r3Assets.forEach(function(id){ matrix.push({label:d.mx[id], cells:[0,0,mid(byId(id))]}); });
  var rtot=[0,0,0];
  matrix.forEach(function(m){ for(var j=0;j<3;j++) rtot[j]+=m.cells[j]; });
  var rgrand=rtot[0]+rtot[1]+rtot[2];

  /* horizontal timeline bar */
  var htlTop='<div class="lab">', htlLine='<div class="line"><div class="track"></div><div class="dots">', htlBot='<div class="lab">';
  for(var hi=0;hi<3;hi++){
    htlTop+='<div class="rn">'+roundLabel(d,hi)+'</div>';
    htlLine+='<div><div class="dot '+(hi===2?'a':(hi===0?'g':''))+'"></div></div>';
    htlBot+='<div><div class="dd">📅 '+d.dates[hi]+'</div><div class="ph">'+d.phases[hi]+'</div>'+
      '<div class="gm">'+d.gm[hi]+'</div>'+
      '<div class="amt'+(hi===2?' a':'')+'">'+baht(rtot[hi]*mTH*fx)+'</div></div>';
  }
  htlTop+='</div>'; htlLine+='</div></div>'; htlBot+='</div>';
  el("htl").innerHTML=htlTop+htlLine+htlBot;

  var rcards="";
  for(var ri=0;ri<3;ri++){
    rcards+='<div class="ccard rd"><div class="rg">'+roundLabel(d,ri)+'</div>'+
      '<div class="dt">📅 '+d.dates[ri]+'</div>'+
      '<div class="baht">'+baht(rtot[ri]*mTH*fx)+'</div>'+
      '<div class="usd">'+usd(rtot[ri]*mTH)+d.rsub[ri]+'</div></div>';
  }
  el("roundCards").innerHTML=rcards;

  var rtbl='<thead><tr><th>'+d.rtCol0+'</th>';
  for(var ci=0;ci<3;ci++){ rtbl+='<th>'+roundLabel(d,ci)+' · '+d.dates[ci]+'</th>'; }
  rtbl+='<th>'+d.rtTot+'</th></tr></thead><tbody>';
  matrix.forEach(function(m){
    var tot=m.cells[0]+m.cells[1]+m.cells[2];
    rtbl+='<tr><td>'+m.label+'</td>';
    for(var j=0;j<3;j++){ rtbl+='<td class="th">'+(m.cells[j]?baht(m.cells[j]*mTH*fx):'—')+'</td>'; }
    rtbl+='<td class="base">'+baht(tot*mTH*fx)+'</td></tr>';
  });
  rtbl+='<tr class="totrow"><td>'+d.rtPer+'</td>'+
    '<td class="th">'+baht(rtot[0]*mTH*fx)+'</td><td class="th">'+baht(rtot[1]*mTH*fx)+'</td>'+
    '<td class="th">'+baht(rtot[2]*mTH*fx)+'</td><td class="base">'+baht(rgrand*mTH*fx)+'</td></tr>';
  rtbl+='</tbody>'; el("roundTbl").innerHTML=rtbl;

  el("roundNote").innerHTML=d.roundNote.replace("{d3}",d.dates[2]);
}

function card(cls,rg,val,fx,m,d){
  return '<div class="ccard '+cls+'"><div class="rg">'+rg+'</div>'+
    '<div class="baht">'+baht(val*fx)+'</div>'+
    '<div class="usd">'+usd(val)+'</div>'+
    '<div class="x">'+d.mult+m.toFixed(2)+'</div></div>';
}

function setLang(c){
  cur=c;
  try{ localStorage.setItem("ropz_region_lang",c); }catch(e){}
  render();
}

/* ================= init ================= */
["fx","mTH","mCN","mWE"].forEach(function(id){ el(id).addEventListener("input",render); });
(function(){
  var bar=el("langbar");
  LANGS.forEach(function(L){
    var b=document.createElement("button");
    b.className="langbtn"; b.setAttribute("data-l",L.c); b.textContent=L.l;
    b.onclick=function(){ setLang(L.c); };
    bar.appendChild(b);
  });
  var saved="th";
  try{ var s=localStorage.getItem("ropz_region_lang"); if(s&&T[s]) saved=s; }catch(e){}
  /* [KEEP] web-publish: ภาษาจาก URL ?lang= ชนะ localStorage (ให้ตรงกับหน้า hub) — อย่าลบ */
  try{ var A={th:"th",en:"en",ko:"ko",kr:"ko",zh:"zh",cn:"zh"};
    var q=(new URLSearchParams(location.search).get("lang")||location.hash.replace("#","")||"").toLowerCase();
    if(A[q]&&T[A[q]]) saved=A[q]; }catch(e){}
  cur=saved;
  render();
})();
</script>
