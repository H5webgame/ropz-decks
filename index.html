<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- [KEEP] web-publish: กัน Google index — อย่าลบ -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>RO PlayZone — Document Hub</title>
<style>
  :root{
    --gold:#C68A1E;--navy:#16305C;--blue:#2E8BE0;--deepblue:#1E5AA8;
    --bg1:#EEF5FE;--bg2:#DCE9FA;--ink:#1B2A3F;--mut:#5B6B82;--line:#DCE6F2;--card:#FFFFFF;
    --shadow:0 6px 22px rgba(20,48,92,.10);--shadow2:0 12px 34px rgba(20,48,92,.18);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg1:#0f1626;--bg2:#0b1120;--ink:#e7ecf6;--mut:#9fb0cc;--line:#26324a;--card:#141c2e;
      --shadow:0 6px 22px rgba(0,0,0,.35);--shadow2:0 12px 34px rgba(0,0,0,.5);--blue:#4c9cf0;--deepblue:#3f86d8;}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Tahoma,'Malgun Gothic','Microsoft YaHei','Microsoft JhengHei','Noto Sans',sans-serif;
    color:var(--ink);min-height:100vh;
    background:
      radial-gradient(60% 55% at 12% 4%, rgba(46,139,224,.16) 0%, transparent 55%),
      radial-gradient(60% 55% at 92% 96%, rgba(22,48,92,.16) 0%, transparent 52%),
      linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    background-attachment:fixed;padding:0 0 64px;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 22px}
  .langbar{position:sticky;top:0;z-index:20;display:flex;justify-content:flex-end;gap:6px;
    padding:12px 22px;backdrop-filter:blur(8px);background:linear-gradient(180deg,rgba(238,245,254,.72),rgba(238,245,254,0));}
  @media (prefers-color-scheme:dark){.langbar{background:linear-gradient(180deg,rgba(15,22,38,.72),rgba(15,22,38,0));}}
  .langbar button{border:1px solid var(--line);background:var(--card);color:var(--deepblue);font-weight:700;
    font-size:13px;padding:6px 12px;border-radius:9px;cursor:pointer;font-family:inherit;transition:.15s}
  .langbar button[aria-pressed="true"]{background:var(--deepblue);color:#fff;border-color:var(--deepblue)}
  .langbar button:hover{transform:translateY(-1px)}
  header.hero{text-align:center;padding:40px 22px 26px}
  .brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.04em;
    color:var(--blue);font-size:13px;text-transform:uppercase;margin-bottom:14px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(198,138,30,.18)}
  h1{font-size:clamp(28px,5vw,44px);line-height:1.12;font-weight:800;letter-spacing:-.01em}
  h1 .accent{color:var(--blue)}
  .sub{margin-top:12px;color:var(--mut);font-size:clamp(14px,2.4vw,17px);max-width:620px;margin-left:auto;margin-right:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:30px}
  a.card{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px;box-shadow:var(--shadow);
    transition:transform .16s,box-shadow .16s,border-color .16s;position:relative;overflow:hidden}
  a.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--gold),var(--blue))}
  a.card:hover{transform:translateY(-4px);box-shadow:var(--shadow2);border-color:var(--blue)}
  .card .no{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.08em}
  .card h3{font-size:19px;line-height:1.3;font-weight:800}
  .card p{color:var(--mut);font-size:14px;line-height:1.55;flex:1}
  .langs{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .langs span{font-size:11px;font-weight:700;color:var(--deepblue);background:rgba(46,139,224,.12);
    padding:3px 8px;border-radius:6px}
  .go{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--blue);font-size:14px;margin-top:4px}
  footer{text-align:center;color:var(--mut);font-size:12.5px;margin-top:40px;padding:0 22px;line-height:1.6}
</style>
</head>
<body>
  <div class="langbar" role="group" aria-label="Language">
    <button data-lang="en" onclick="setLang('en')">EN</button>
    <button data-lang="th" onclick="setLang('th')">ไทย</button>
    <button data-lang="ko" onclick="setLang('ko')">한국어</button>
    <button data-lang="zh" onclick="setLang('zh')">中文</button>
  </div>

  <div class="wrap">
    <header class="hero">
      <div class="brand"><span class="dot"></span>RO PlayZone</div>
      <h1 data-i18n="h1"></h1>
      <p class="sub" data-i18n="sub"></p>
    </header>

    <div class="grid">
      <a class="card" data-href="business-model.html">
        <div class="no">01</div>
        <h3 data-i18n="c1t"></h3>
        <p data-i18n="c1d"></p>
        <div class="langs"><span>TH</span><span>EN</span><span>KO</span><span>ZH</span></div>
        <div class="go" data-i18n="open"></div>
      </a>

      <a class="card" data-href="webgame-demographics.html">
        <div class="no">02</div>
        <h3 data-i18n="c2t"></h3>
        <p data-i18n="c2d"></p>
        <div class="langs"><span>TH</span><span>EN</span><span>KO</span></div>
        <div class="go" data-i18n="open"></div>
      </a>

      <a class="card" data-href="outsource-region.html">
        <div class="no">03</div>
        <h3 data-i18n="c3t"></h3>
        <p data-i18n="c3d"></p>
        <div class="langs"><span>TH</span><span>EN</span><span>KO</span><span>ZH</span></div>
        <div class="go" data-i18n="open"></div>
      </a>

      <a class="card" data-href="player-systems-guide.html">
        <div class="no">04</div>
        <h3 data-i18n="c4t"></h3>
        <p data-i18n="c4d"></p>
        <div class="langs"><span>TH</span><span>EN</span><span>KO</span><span>ZH</span></div>
        <div class="go" data-i18n="open"></div>
      </a>
    </div>

    <footer data-i18n="foot"></footer>
  </div>

<script>
  var I18N={
    en:{
      h1:'RO PlayZone <span class="accent">Document Hub</span>',
      sub:'All project documents in one place. Pick a language above, then open any document.',
      c1t:'Web-Game Business Model',
      c1d:'How the web-game market makes money, how the two big players operate, and why RO can do it better.',
      c2t:'Demographics & Spending',
      c2d:'Who plays web games and how they spend, broken down by gender and region.',
      c3t:'Outsource Pricing by Region',
      c3d:'Comparison of game-outsourcing costs across regions to guide budget decisions.',
      c4t:'Player Systems Guide',
      c4d:'A guide to the in-game systems, explained for players.',
      open:'Open →',
      foot:'Internal documents · link-only, not indexed by search engines. Please do not share outside the intended audience.'
    },
    th:{
      h1:'RO PlayZone <span class="accent">ศูนย์รวมเอกสาร</span>',
      sub:'รวมเอกสารโปรเจกต์ไว้ที่เดียว เลือกภาษาด้านบน แล้วกดเปิดเอกสารที่ต้องการได้เลย',
      c1t:'โมเดลธุรกิจเว็บเกม',
      c1d:'ตลาดเว็บเกมทำเงินยังไง สองเจ้าใหญ่ทำแบบไหน และทำไม RO ทำได้ดีกว่า',
      c2t:'ประชากรศาสตร์ & การใช้จ่าย',
      c2d:'ใครเล่นเว็บเกมและใช้จ่ายอย่างไร แยกตามเพศและภูมิภาค',
      c3t:'เปรียบเทียบราคา Outsource ตามภูมิภาค',
      c3d:'เทียบต้นทุนจ้างทำเกมแต่ละภูมิภาค เพื่อช่วยตัดสินใจเรื่องงบประมาณ',
      c4t:'คู่มือระบบสำหรับผู้เล่น',
      c4d:'อธิบายระบบต่าง ๆ ในเกมสำหรับผู้เล่น',
      open:'เปิด →',
      foot:'เอกสารภายใน · เข้าได้เฉพาะคนมีลิงก์ ไม่ถูก search engine เก็บ กรุณาอย่าส่งต่อออกนอกกลุ่มที่ตั้งใจ'
    },
    ko:{
      h1:'RO PlayZone <span class="accent">문서 허브</span>',
      sub:'프로젝트 문서를 한곳에 모았습니다. 위에서 언어를 선택한 뒤 문서를 열어보세요.',
      c1t:'웹게임 비즈니스 모델',
      c1d:'웹게임 시장이 돈을 버는 방식, 두 강자의 운영 방식, 그리고 RO가 더 잘할 수 있는 이유.',
      c2t:'인구통계 & 지출',
      c2d:'누가 웹게임을 하고 어떻게 지출하는지 성별과 지역별로 정리.',
      c3t:'지역별 아웃소싱 단가 비교',
      c3d:'예산 결정을 돕기 위한 지역별 게임 아웃소싱 비용 비교.',
      c4t:'플레이어 시스템 가이드',
      c4d:'플레이어를 위한 인게임 시스템 설명 가이드.',
      open:'열기 →',
      foot:'내부 문서 · 링크 전용, 검색엔진 미노출. 의도한 대상 외에는 공유하지 마세요.'
    },
    zh:{
      h1:'RO PlayZone <span class="accent">文档中心</span>',
      sub:'所有项目文档集中于此。请先在上方选择语言，再打开所需文档。',
      c1t:'网页游戏商业模式',
      c1d:'网页游戏市场如何赚钱、两大平台如何运作，以及为什么 RO 能做得更好。',
      c2t:'人群与消费',
      c2d:'谁在玩网页游戏、如何消费，按性别与地区细分。',
      c3t:'各地区外包价格比较',
      c3d:'比较各地区游戏外包成本，辅助预算决策。',
      c4t:'玩家系统指南',
      c4d:'面向玩家的游戏内系统说明。',
      open:'打开 →',
      foot:'内部文档 · 仅限链接访问，不被搜索引擎收录。请勿分享给目标受众以外的人。'
    }
  };
  var lang='th';
  function applyLang(){
    var d=I18N[lang]||I18N.th;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var v=d[el.getAttribute('data-i18n')]; if(v!=null) el.innerHTML=v;
    });
    document.documentElement.lang=lang;
    document.querySelectorAll('.langbar button').forEach(function(b){
      b.setAttribute('aria-pressed', b.getAttribute('data-lang')===lang);
    });
    var q=(lang&&lang!=='th')?('?lang='+lang):'';
    document.querySelectorAll('a.card').forEach(function(a){
      a.setAttribute('href', a.getAttribute('data-href')+q);
    });
  }
  function setLang(l){ lang=l; applyLang(); try{localStorage.setItem('rpz_hub_lang',l)}catch(e){} }
  (function(){
    try{ lang=localStorage.getItem('rpz_hub_lang')||'th'; }catch(e){}
    /* [KEEP] web-publish: ภาษาจาก URL ?lang= ชนะ localStorage — อย่าลบ */
    try{ var a={th:'th',en:'en',ko:'ko',kr:'ko',zh:'zh',cn:'zh'};
      var q=(new URLSearchParams(location.search).get('lang')||location.hash.replace('#','')||'').toLowerCase();
      if(a[q]) lang=a[q]; }catch(e){}
    applyLang();
  })();
</script>
</body>
</html>
