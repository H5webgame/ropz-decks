<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Character System — System Design v0.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E1B36;--deep:#16305C;--blue:#2E8BE0;--blue-d:#1F6FD4;--sec:#46587C;
      --muted:#8A9AB8;--line:#D8E2F0;--paper:#EDF2FA;--bg:#fff;--red:#C4453B}
@media (prefers-color-scheme:dark){
  :root{--ink:#E8EEF9;--deep:#BCD2EE;--sec:#A9BAD6;--muted:#7F91B0;
        --line:#27354F;--paper:#141D31;--bg:#0C1322}
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
     color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;padding:24px}
.gate{width:100%;max-width:460px;text-align:left}
.brand{font-family:'Kanit',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;
       text-transform:uppercase;color:var(--blue);margin:0 0 10px}
h1{font-family:'Kanit',sans-serif;font-weight:600;font-size:clamp(20px,4vw,27px);
   line-height:1.25;margin:0 0 10px;color:var(--ink)}
.sub{color:var(--sec);font-size:14.5px;line-height:1.7;margin:0 0 22px}
form{display:flex;gap:8px;flex-wrap:wrap}
#pw{flex:1;min-width:190px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--ink);font-family:inherit;font-size:15px}
#pw:focus{outline:0;border-color:var(--blue)}
#go{padding:12px 24px;border:0;border-radius:10px;background:var(--blue);color:#fff;
    font-family:'Kanit',sans-serif;font-weight:600;font-size:15px;cursor:pointer}
#go:hover{background:var(--blue-d)}
#go:disabled{background:var(--muted);cursor:default}
.msg{min-height:22px;margin:14px 0 0;font-size:14px;color:var(--red)}
.msg.work{color:var(--sec)}
.fine{margin:26px 0 0;padding-top:16px;border-top:1px solid var(--line);
      color:var(--muted);font-size:12px;line-height:1.7}
.fine code{font-family:Consolas,ui-monospace,monospace;color:var(--sec)}
</style>
</head>
<body>
<main class="gate">
  <p class="brand">RO PlayZone</p>
  <h1>Character System — System Design v0.1</h1>
  <p class="sub">เอกสารนี้เข้ารหัสไว้ ใส่รหัสผ่านเพื่อเปิดอ่าน<br>
    <span lang="en">This document is encrypted. Enter the passphrase to open it.</span></p>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" placeholder="รหัสผ่าน / Passphrase" autocomplete="off" autofocus>
    <button type="submit" id="go">เปิดอ่าน</button>
  </form>
  <p class="msg" id="msg"></p>
  <p class="fine">AES-256-GCM &middot; PBKDF2-SHA256 <code>600000</code> rounds.<br>
    ถอดรหัสในเบราว์เซอร์ของคุณทั้งหมด รหัสผ่านไม่ถูกส่งไปที่ไหนเลย</p>
</main>

function b64(s){
  var bin = atob(s), u = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function say(t, working){
  var m = document.getElementById("msg");
  m.textContent = t; m.className = "msg" + (working ? " work" : "");
}
async function ungzip(buf){
  if (typeof DecompressionStream !== "function")
    throw new Error("เบราว์เซอร์เก่าเกินไป (ไม่รองรับ DecompressionStream)");
  var ds = new DecompressionStream("gzip");
  var stream = new Blob([buf]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unlock(pass){
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  var packed = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(IV) }, key, b64(CT));
  swap(new TextDecoder().decode(await ungzip(packed)));
}
function swap(html){
  var doc = new DOMParser().parseFromString(html, "text/html");
  document.head.innerHTML = doc.head.innerHTML;
  document.body.innerHTML = doc.body.innerHTML;
  document.body.className = doc.body.className;
  var root = doc.documentElement;
  for (var a = 0; a < root.attributes.length; a++)
    document.documentElement.setAttribute(root.attributes[a].name, root.attributes[a].value);
  var olds = [].slice.call(document.querySelectorAll("script"));
  for (var i = 0; i < olds.length; i++){
    var s = document.createElement("script");
    for (var j = 0; j < olds[i].attributes.length; j++)
      s.setAttribute(olds[i].attributes[j].name, olds[i].attributes[j].value);
    s.textContent = olds[i].textContent;
    olds[i].parentNode.replaceChild(s, olds[i]);
  }
}
document.getElementById("f").addEventListener("submit", function(e){
  e.preventDefault();
  var pw = document.getElementById("pw").value;
  if (!pw) { say("ใส่รหัสผ่านก่อน"); return; }
  var go = document.getElementById("go");
  go.disabled = true; say("กำลังถอดรหัส…", true);
  unlock(pw).catch(function(err){
    go.disabled = false;
    say("รหัสผ่านไม่ถูกต้อง หรือไฟล์เสียหาย");
    console.error(err);
  });
});
