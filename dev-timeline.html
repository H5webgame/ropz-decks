<title>Development Timeline ROPZ</title>

<style>
:root{
  --bg:#eef1f6; --page:#ffffff; --ink:#1a1f2b; --muted:#6b7280; --line:#e3e6ec; --soft:#f3f5f9;
  --now:#c0392b;
  --c0:#1f5fd1; --c1:#1e8a4c; --c2:#b8860b; --c3:#2c7a5a; --c4:#6c4fd1;
  --b0:#2f6fe4; --b1:#c7d2e3; --b2:#e3b04b; --b3:#bfe2cd;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101318; --page:#181c23; --ink:#e8e9ee; --muted:#9aa3b2; --line:#2b313c; --soft:#1f2530;
    --now:#ef6b5a;
    --c0:#6b9cff; --c1:#5fcf8a; --c2:#e8c25a; --c3:#6fcfa5; --c4:#b39cff;
    --b0:#3f7ff0; --b1:#3a4559; --b2:#b58a2e; --b3:#2f6a4c;
  }
}
:root[data-theme="dark"]{
  --bg:#101318; --page:#181c23; --ink:#e8e9ee; --muted:#9aa3b2; --line:#2b313c; --soft:#1f2530;
  --now:#ef6b5a;
  --c0:#6b9cff; --c1:#5fcf8a; --c2:#e8c25a; --c3:#6fcfa5; --c4:#b39cff;
  --b0:#3f7ff0; --b1:#3a4559; --b2:#b58a2e; --b3:#2f6a4c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.45}
html[lang="ko"] body{font-family:"Noto Sans KR","Sarabun",system-ui,sans-serif}
.page{max-width:1240px;margin:20px auto;background:var(--page);border-radius:14px;padding:34px 40px 26px;box-shadow:0 2px 16px rgba(0,0,0,.06)}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}
h1{font-size:34px;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px;margin:0}
.meta{text-align:right;font-size:12.5px;color:var(--muted);line-height:1.5}
.meta b{display:block;color:var(--ink);font-size:13px;letter-spacing:.04em}
.tools{display:flex;gap:6px;justify-content:flex-end;margin-top:8px;align-items:center}
button{font:inherit;font-weight:600;font-size:12px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--page);color:var(--ink);cursor:pointer}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-right:6px}
.lang button{border:0;border-radius:0}
.lang button+button{border-left:1px solid var(--line)}
.lang button.on{background:var(--ink);color:var(--page)}

/* progress bar */
.bar{position:relative;margin:0 0 70px}
.lv{display:flex;font-weight:700;font-size:13px;margin-bottom:6px}
.lv span:nth-child(1){color:var(--c0)} .lv span:nth-child(2){color:var(--c1)} .lv span:nth-child(3){color:var(--c2)} .lv span:nth-child(4){color:var(--c3)}
.seg{display:flex;height:18px;border-radius:3px;overflow:hidden}
.seg div{height:100%}
.seg .s0,.seg .s1{background:var(--b1)} .seg .s2{background:var(--b2)} .seg .s3{background:var(--b3)}
.fill{position:absolute;left:0;top:25px;height:18px;background:var(--b0);border-radius:3px 0 0 3px}
.cursor{position:absolute;top:21px;width:2px;height:26px;background:var(--now)}
.prog{position:absolute;left:0;top:48px;font-size:12.5px;white-space:nowrap}
.prog b{color:var(--now)}
.marks{position:absolute;left:0;right:0;top:48px}
.mk{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap}
.mk::before{content:"";display:block;width:9px;height:9px;background:var(--c1);transform:rotate(45deg);margin:0 auto 5px}
.mk.ms::before{background:var(--c2)}
.mk.go::before{background:var(--now)}
.mk.last{transform:none;text-align:right;left:auto!important;right:0}
.mk.last::before{margin-right:0}
.mk b{display:block;font-size:12.5px}
.mk small{display:block;font-size:11px;color:var(--muted)}

/* columns */
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.col{padding:0 16px 10px 0;border-right:1px solid var(--line)}
.col+.col{padding-left:16px}
.col:last-child{border-right:0;padding-right:0}
.col .ttl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding-bottom:6px;border-bottom:3px solid currentColor}
.col .ttl small{display:block;font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:6px}
.col.k0 .ttl,.col.k0 .goal{color:var(--c0)} .col.k1 .ttl,.col.k1 .goal{color:var(--c1)} .col.k2 .ttl,.col.k2 .goal{color:var(--c2)} .col.k3 .ttl,.col.k3 .goal{color:var(--c3)} .col.k4 .ttl,.col.k4 .goal{color:var(--c4)}
.dur{margin:14px 0 2px;font-size:13px;color:var(--muted)}
.dur b{font-size:34px;color:var(--ink);font-weight:600;margin-right:6px;line-height:1}
.range{font-size:13px;color:var(--muted)}
.goal{font-size:13px;font-weight:600;margin:6px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grp{font-size:11.5px;color:var(--muted);font-weight:600;margin:12px 0 4px}
.it{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:2px 0}
.it span:last-child{color:var(--muted);font-size:12px;white-space:nowrap;padding-top:2px}
.it.ms span:first-child{font-weight:700}
.it.ext span:first-child{color:var(--muted)}
.it.q span:first-child{color:var(--now);font-weight:600}
.note{margin-top:20px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--page);padding:8px 14px;border-radius:8px;font-size:14px;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:1000px){
  .cols{grid-template-columns:repeat(2,1fr)}
  .col{border-right:0;border-bottom:1px solid var(--line);padding:0 0 16px;margin-bottom:16px}
  .col+.col{padding-left:0}
  .page{padding:24px 20px}
  .bar{margin-bottom:84px}
  .mk b{font-size:11px}
}
@media (max-width:600px){ .cols{grid-template-columns:1fr} header{flex-direction:column} .meta{text-align:left} .tools{justify-content:flex-start} }
@media print{ body{background:#fff} .page{box-shadow:none;margin:0;max-width:none} .tools,.toast{display:none} @page{size:landscape;margin:10mm} }
</style>
</head>

</header>

<div class="cols" id="cols"></div>

var LANG = "th";
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function render(){
  var T = I18N[LANG];
  document.documentElement.setAttribute("lang", LANG);
  document.getElementById("t-title").textContent = T.title;
  document.getElementById("t-sub").textContent = T.sub;
  document.getElementById("t-meta").textContent = T.meta;
  document.getElementById("copyBtn").textContent = T.btn.copy;
  document.getElementById("themeBtn").textContent = T.btn.theme;
  document.getElementById("printBtn").textContent = T.btn.print;
  var w = [20,30,30,20];
  document.getElementById("lv").innerHTML = T.lv.map(function(x,i){return "<span style=\"width:"+w[i]+"%\">"+esc(x)+"</span>";}).join("");
  document.getElementById("prog").innerHTML = T.prog;
  document.getElementById("marks").innerHTML = T.marks.map(function(m){
    var st = m[1].indexOf("last")>=0 ? "" : " style=\"left:"+m[0]+"%\"";
    return "<div class=\"mk "+m[1]+"\""+st+"><b>"+esc(m[2])+"</b><small>"+esc(m[3])+"</small></div>";
  }).join("");
  document.getElementById("cols").innerHTML = T.cols.map(function(c,i){
    var h = "<div class=\"col k"+i+"\"><div class=\"ttl\">"+esc(c.ttl)+"<small>"+esc(c.sub)+"</small></div>";
    h += "<div class=\"dur\"><b>"+esc(c.n)+"</b>"+esc(c.u)+"</div><div class=\"range\">"+esc(c.range)+"</div><div class=\"goal\">"+esc(c.goal)+"</div>";
    c.groups.forEach(function(g){
      h += "<div class=\"grp\">"+esc(g[0])+"</div>";
      g[1].forEach(function(it){ h += "<div class=\"it "+it[2]+"\"><span>"+esc(it[0])+"</span><span>"+esc(it[1])+"</span></div>"; });
    });
    return h + "</div>";
  }).join("");
  document.getElementById("t-note").textContent = T.note;
  document.getElementById("t-full").textContent = T.full;
  document.querySelectorAll("#langBox button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-lang")===LANG); });
}
function toText(){
  var T = I18N[LANG], L = [T.title+" · "+T.sub, ""];
  T.marks.forEach(function(m){ L.push("◆ "+m[2]+" "+m[3]); });
  L.push("");
  T.cols.forEach(function(c){
    L.push("== "+c.ttl+" · "+c.sub+" · "+c.range+" ==");
    L.push(c.goal);
    c.groups.forEach(function(g){ L.push("["+g[0]+"]"); g[1].forEach(function(it){ L.push("  - "+it[0]+" — "+it[1]); }); });
    L.push("");
  });
  L.push(T.note);
  return L.join("\n");
}
(function(){
  var root = document.documentElement;
  try{ var t = localStorage.getItem("ropz-theme"); if (t) root.setAttribute("data-theme", t); }catch(e){}
  try{
    var q = (location.search.match(/[?&]lang=(th|en|ko)/)||[])[1];
    LANG = q || localStorage.getItem("ropz-tl-lang") || "th";
  }catch(e){}
  render();
  document.getElementById("langBox").addEventListener("click", function(ev){
    var b = ev.target.closest("button"); if (!b) return;
    LANG = b.getAttribute("data-lang");
    try{ localStorage.setItem("ropz-tl-lang", LANG); }catch(e){}
    render();
  });
  document.getElementById("themeBtn").addEventListener("click", function(){
    var cur = root.getAttribute("data-theme");
    var dark = cur ? cur==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try{ localStorage.setItem("ropz-theme", next); }catch(e){}
  });
  document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
  function toast(msg){ var el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); setTimeout(function(){ el.classList.remove("show"); },1400); }
  function fallback(txt){ var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast(I18N[LANG].btn.copied); }catch(e){ toast(I18N[LANG].btn.fail); } document.body.removeChild(ta); }
  document.getElementById("copyBtn").addEventListener("click", function(){
    var txt = toText();
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ toast(I18N[LANG].btn.copied); }, function(){ fallback(txt); }); }
    else fallback(txt);
  });
})();
